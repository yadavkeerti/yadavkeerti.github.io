  summary: >
    Recent Ph.D. graduate in Regional Development with experience collaborating across interdisciplinary research teams and with academic and
    professional partners. Experience spanning spatial data analysis, transit and mobility data, and quasi-experimental causal inference for urban
    infrastructure and transport policy. Doctoral research applies staggered Difference-in-Differences (Callaway-Sant'Anna) methodology to estimate
    the heterogeneous regional effects of high-speed rail across 31 South Korean cities (2008-2020), building and validating a multi-source panel
    dataset that integrates administrative records, road-network infrastructure, and satellite-derived (Landsat/Sentinel-2 NDBI) land-use change
    parameters. Current work involves developing and applying geospatial and deep learning approaches to climate-risk assessment, environmental and
    geophysical data interpretation, and urban and transportation-related research, while collaborating with researchers across interdisciplinary
    fields. Overall research experience spans urban infrastructure, transport, regional development, and Geospatial AI, with a focus on applying
    spatial data and quantitative methods to real-world urban and regional challenges.

