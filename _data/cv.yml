  summary: >
    Ph.D. geographer and geospatial data scientist with 3+ years of
    experience spanning spatial data analysis, transit and mobility data
    systems, remote sensing/Earth observation, and quasi-experimental causal
    inference for urban infrastructure and transport policy. Doctoral research
    applies staggered Difference-in-Differences (Callaway-Sant'Anna)
    methodology to estimate the heterogeneous regional effects of high-speed
    rail across 31 South Korean cities and nine transit corridors
    (2008-2020), building and validating a multi-source panel dataset that
    integrates administrative records, road-network and infrastructure
    variables, and satellite-derived (Landsat/Sentinel-2 NDBI) land-use
    change. Applied Earth observation work extends to drought and heatwave
    risk modeling and land-use vulnerability assessment across South Korea
    and India. Proficient in Python and R for spatial data pipelines and
    analytical modeling, and in ArcGIS, QGIS, Google Earth Engine, OSMnx, and
    the Kakao Maps API for GIS, remote sensing, and transit-network analysis.

  sections:
    Education:
      - institution: Kongju National University, South Korea
        area: Geography
        degree: PhD
        start_date: 2022-03
        end_date: 2026-02
        highlights:
          - "Thesis: Heterogeneous Regional Effects of High-Speed Rail on Small
            and Medium-Sized Cities in South Korea: Focusing on Staggered
            Difference-in-Differences Analysis (2008-2020)"
      - institution: Busan University of Foreign Studies, South Korea
        area: Language Training Program
        start_date: 2021-01
        end_date: 2022-02
      - institution: Jawaharlal Nehru University, India
        area: Korean Studies, School of Language, Literature and Cultural Studies
        degree: MA
        start_date: 2019-08
        end_date: 2021-05
      - institution: Jawaharlal Nehru University, India
        area: Korean Studies, School of Language, Literature and Cultural Studies
        degree: BA
        start_date: 2016-08
        end_date: 2019-05

    Experience:
      - company: Kongju National University, South Korea
        position: Ph.D. Researcher - Regional Development & Urban Transport
        start_date: 2022-03
        end_date: 2026-02
        highlights:
          - Isolated heterogeneous regional treatment effects of high-speed
            rail across cities (2008-2020) by validating a quasi-experimental design.
          - Delivered an analysis-ready, multi-source panel dataset spanning
            31 cities and 13 years by resolving data-source misalignments,
            missing-value gaps, and administrative boundary/name
            inconsistencies, using custom R- and Python-based crosswalk and
            geocoding routines.
          - Quantified land-use and built-up change across cities by
            integrating Landsat/Sentinel-2 NDBI satellite imagery with
            socioeconomic panel data in R, ArcGIS, and Google Earth Engine,
            enabling city-level geospatial impact analysis at scale.
          - Corrected geographic boundary errors and closed data gaps across
            the panel dataset by cross-checking satellite-derived land-use
            change against socioeconomic and infrastructure records in
            ArcGIS, QGIS, and Google Earth Engine, aligning results with
            local administrative policy.
          - Reduced manual data-integration effort on recurring road-network
            updates by building automated cross-join pipelines in Python and
            R for expressway and national-highway variables, cutting
            ingestion and quality-check time across the dataset.
          - Built reusable working knowledge of Korean public and geospatial
            datasets by using OSMnx to extract and analyze street-network
            data and the Kakao Maps API to plot and cross-check
            Korea-specific spatial resources.
          - Produced actionable, country-specific transit and mobility
            recommendations for India and South Korea by synthesizing policy
            documents, spatial data, and governance case studies with local
            governance bodies and academic partners into a cross-national
            research framework.
          - Sustained reproducibility across a multi-year, multi-partner
            project by documenting research methodology and data pipelines
            throughout, supporting consistent process compliance for all
            collaborators.

      - company: Kongju National University, South Korea
        position: Research Assistant - Mapping & Spatial Data
        start_date: 2023-01
        end_date: 2024-12
        highlights:
          - Maintained data integrity for university mapping projects by
            supporting collection, cleaning, and validation processes in
            coordination with faculty and external data providers.
      - company: International forums & institutions, South Korea & India
        position: Korean-English Translator & Cultural Liaison / International
          Program Coordinator
        start_date: 2020-01
        end_date: present
        highlights:
          - Enabled clear communication across 5+ major cross-border
            programs (2023-2026) by serving as trusted translator and
            cultural liaison between Korean institutions and
            international/Indian delegations, including the 47th
            International Exhibition on Environmental Technology & Green
            Energy (Seoul, 2026), International Forum on One Korea (Seoul,
            2024), Korea International Model United Nations (Seoul, 2024),
            Global Peace Leadership Corps (Seoul, 2024), and the Andong
            Cultural Exchange (Andong, 2023).
          - Delivered a 10-day international exchange program for HUFS
            students (Delhi, 2020) by organizing and leading end-to-end
            travel, scheduling, and on-the-ground coordination.

