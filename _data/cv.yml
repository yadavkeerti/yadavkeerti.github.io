    Experience:
      - company: Kongju National University, South Korea
        position: Ph.D. Researcher - Regional Development & Urban Transport
        start_date: 2022-03
        end_date: 2026-02
        highlights:
          - Identified heterogeneous regional effects of high-speed rail across 31 cities (2008-2020) using a quasi-experimental research design.
          - Constructed and validated an original multi-source panel dataset by systematically compiling and harmonizing socioeconomic, infrastructure, and administrative data using R and Python.
          - Developed an original city-level geospatial dataset by integrating Landsat/Sentinel-2 imagery with socioeconomic and land-use data using Google Earth Engine, ArcGIS, and QGIS to assess changes in built-up areas and land use.
          - Worked with public and geospatial datasets, using Python, R, OSMnx, and Kakao Maps and ACS API to collect, integrate, and analyse facilities, road-network, and transport data.
          - Developed India-focused transit and mobility recommendations by comparing South Korean policies, spatial data, and governance practices with Indian contexts in collaboration with local governance bodies and academic partners.
          - Kept the project well-documented and repeatable, helping collaborators follow consistent methods and achieve reliable results over time.
          - Extended doctoral research into applied climate risk assessment by conducting a study on land-use vulnerability in Zabö agriculture (Northeast India) and a collaborative GIS-based deep ensemble model of drought and heatwave risk in Rajasthan.
      - company: Kongju National University, South Korea
